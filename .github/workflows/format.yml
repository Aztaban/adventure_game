name: Format code

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to format (not main)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: format-${{ inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  format:
    name: Apply Ruff formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Validate target branch
        run: |
          git check-ref-format --branch "$TARGET_BRANCH"
          if [ "$TARGET_BRANCH" = "main" ] ||
             [ "$TARGET_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "Formatting the main/default branch is disabled."
            exit 1
          fi

      - name: Check out target branch
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.target_branch || github.ref_name }}
          token: ${{ secrets.FORMATTER_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Format source and tests
        run: python -m ruff format src tests

      - name: Commit and push formatting changes
        run: |
          git add -u -- src tests

          if git diff --cached --quiet; then
            echo "Everything is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "style: apply Ruff formatting"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

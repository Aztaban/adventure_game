name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Read current PR metadata
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"

      - name: Validate PR version and changelog
        if: github.event_name == 'pull_request'
        run: python scripts/pr_version.py --check
        env:
          PR_METADATA_PATH: ${{ runner.temp }}/pr.json

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Check lint
        run: python -m ruff check src tests scripts

      - name: Run tests
        run: python -m pytest -q
